services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in n8n/.env}
      WEBHOOK_URL: ${WEBHOOK_URL:?Set a public HTTPS URL for n8n webhooks}
      N8N_EDITOR_BASE_URL: ${WEBHOOK_URL:?Set a public HTTPS URL for the n8n editor}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: ${GENERIC_TIMEZONE:-UTC}
      LENDLOOP_SHARED_SECRET: ${LENDLOOP_SHARED_SECRET:?Set the same shared secret in Convex and n8n}
      CONVEX_SITE_URL: ${CONVEX_SITE_URL:?Set the Convex site URL}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
